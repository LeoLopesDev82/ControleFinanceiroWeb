name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The suite covers pure logic only: keyword matching, the parsing
      # helpers and model validation. Nothing here touches Firebird, so the
      # runner needs no database.
      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"
